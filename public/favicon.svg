<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="INBSHIPS">
  <!--
    Arrival: something moving right, and the quay it is moving toward.

    This replaced the Supabase bolt that shipped with the template, in #863bff, which belonged to no
    palette in this estate and identified the database rather than the module.

    Four shapes, because the tab renders this at 16px and anything finer turns to mush. The wake
    marks are the only concession to detail and are held quiet on purpose: at thumbnail size they
    should read as motion, not as clutter.

    Colours are the module's own tokens rather than new values. The ink tile is the estate's shared
    harbor-950, so this sits beside the other modules as a sibling; transit violet is what says which
    module it is. The arrow takes signal-400 rather than 500 because it sits on ink here, and the
    lighter step is what clears contrast on a dark ground.

    NB: no double hyphen anywhere in this comment. XML forbids it inside a comment body, and writing
    a CSS variable with its leading dashes once shipped a malformed icon in this estate that
    browsers rendered as nothing, silently, with no error anywhere.
  -->
  <rect width="32" height="32" rx="7" fill="#112424"/>

  <!-- the quay: what the shipment is arriving at -->
  <rect x="23" y="7.5" width="2.6" height="17" rx="1.3" fill="#f7f7f5"/>

  <!-- inbound, moving toward it -->
  <path d="M9 9.4 L20.4 16 L9 22.6 Z" fill="#a99aea"/>

  <!-- wake -->
  <rect x="4.6" y="12.6" width="3.4" height="1.9" rx="0.95" fill="#a99aea" opacity="0.45"/>
  <rect x="4.6" y="17.5" width="3.4" height="1.9" rx="0.95" fill="#a99aea" opacity="0.45"/>
</svg>
