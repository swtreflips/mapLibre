<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ACTIVE SKIN — the same file the other three apps use. This app is the newest and had no
         visual identity of its own; inheriting the platform skin from the start is the whole
         point of having one, and far cheaper than converging a fifth look later. -->
    <link id="skin" rel="stylesheet" href="/skins/linen.css" />
    <!-- MODULE ACCENT. Order matters: this overrides only the accent ramp, so it must follow
         the skin. Everything else still comes from linen. -->
    <link rel="stylesheet" href="/skins/accent-inbound.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#112424" />
    <title>Inbound — Logistics OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- linen: Fraunces display, DM Sans UI, DM Mono numerics. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
